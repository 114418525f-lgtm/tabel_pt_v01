<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Табель учёта рабочего времени</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e2229;
    --border: #2a2f3a;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #e8eaf0;
    --text2: #8892a4;
    --text3: #4a5568;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    height: 100dvh;
  }

  body {
    font-family: 'Onest', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(79,142,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,58,237,0.06) 0%, transparent 50%);
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .header-text h1 {
    font-size: 16px; font-weight: 600; color: var(--text);
  }
  .header-text p {
    font-size: 12px; color: var(--text2);
  }

  /* Chat container */
  .chat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 32px 64px rgba(0,0,0,0.5),
      0 0 80px rgba(79,142,247,0.04);
  }

  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
  }
  .bot-avatar {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .bot-info { flex: 1; }
  .bot-name { font-size: 13px; font-weight: 600; }
  .bot-status { font-size: 11px; color: var(--success); display: flex; align-items: center; gap: 4px; }
  .bot-status::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    display: inline-block;
  }

  /* Messages */
  .messages {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Message bubble */
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 88%;
    gap: 4px;
    animation: msgIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .bot .bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .user .bubble {
    background: linear-gradient(135deg, var(--accent), #3b7de8);
    border-bottom-right-radius: 4px;
    color: #fff;
  }
  .msg-time {
    font-size: 10px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
  }
  .bot .msg-time { align-self: flex-start; padding-left: 4px; }
  .user .msg-time { align-self: flex-end; padding-right: 4px; }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 12px 15px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 7px; height: 7px;
    background: var(--text3);
    border-radius: 50%;
    animation: dot 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    overflow-y: auto;
    flex-shrink: 0;
    max-height: 60dvh;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .input-area::-webkit-scrollbar { width: 4px; }
  .input-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .text-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .text-input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .text-input-row input:focus { border-color: var(--accent); }
  .text-input-row input::placeholder { color: var(--text3); }

  .btn-send {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 18px;
    width: 42px; height: 42px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-send:hover { background: #3b7de8; transform: scale(1.05); }

  .buttons-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Action buttons */
  .btn {
    width: 100%;
    padding: 11px 16px;
    min-height: 44px;
    border-radius: var(--radius-sm);
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #3b7de8);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79,142,247,0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,142,247,0.35); }
  .btn-secondary {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text2);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.06); }
  .btn-sq {
    padding: 0;
    flex-shrink: 0;
    font-weight: 700;
    color: var(--danger) !important;
    border-color: rgba(239,68,68,0.35) !important;
    background: rgba(239,68,68,0.07) !important;
  }
  .btn-sq:hover {
    background: rgba(239,68,68,0.18) !important;
    border-color: var(--danger) !important;
  }
  .btn-check-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .btn-check-row .btn-check-main { flex: 1; }
  .btn-danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(239,68,68,0.25);
  }
  .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(239,68,68,0.4); }
  .btn-success {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(34,197,94,0.2);
  }
  .btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(34,197,94,0.3); }

  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* Row buttons */
  .btn-row {
    display: flex;
    gap: 8px;
  }
  .btn-row .btn { flex: 1; }

  /* Calendar */
  .calendar-wrap {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    margin-bottom: 12px;
  }
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .cal-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    text-transform: capitalize;
  }
  .cal-nav {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav:hover { border-color: var(--accent); color: var(--accent); }

  .cal-days-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 2px;
  }
  .cal-day-name {
    text-align: center;
    font-size: 10px;
    color: var(--text3);
    padding: 2px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .cal-day {
    aspect-ratio: 5 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
    position: relative;
  }
  .cal-day:hover:not(.empty):not(.disabled) {
    background: rgba(79,142,247,0.12);
    border-color: rgba(79,142,247,0.3);
    color: var(--accent);
  }
  .cal-day.selected {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .cal-day.today {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .cal-day.today.selected { color: #fff; }
  .cal-day.filled::after {
    content: '';
    position: absolute;
    bottom: 3px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--success);
    border-radius: 50%;
  }
  .cal-day.filled.selected::after { background: #fff; }
  .cal-day.missing::after {
    content: '';
    position: absolute;
    bottom: 3px; left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--danger);
    border-radius: 50%;
  }
  .cal-day.missing.selected::after { background: #fff; }
  .cal-day.empty { cursor: default; }
  .cal-day.disabled {
    color: var(--text3);
    cursor: default;
  }
  .cal-day.weekend { color: #f87171; }
  .cal-day.weekend.selected { color: #fff; }
  .cal-day.weekend.disabled { color: var(--text3); }

  /* Hours selector */
  .hours-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .hour-btn {
    padding: 9px 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .hour-btn:hover { border-color: var(--accent); color: var(--accent); }
  .hour-btn.active {
    background: rgba(79,142,247,0.15);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* Textarea */
  .tabel-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 13px;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    min-height: 90px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .tabel-textarea:focus { border-color: var(--accent); }
  .tabel-textarea::placeholder { color: var(--text3); }
  .char-count {
    font-size: 11px;
    color: var(--text3);
    text-align: right;
    margin-top: -10px;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .char-count.warn { color: var(--warning); }

  /* Password input */
  .pwd-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .pwd-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.1em;
  }
  .pwd-row input:focus { border-color: var(--accent); }

  /* Check result */
  .check-result {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
  }
  .check-result-date {
    font-size: 11px;
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
  }
  .check-result-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .check-result-hours {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
  }
  .hours-badge {
    background: rgba(79,142,247,0.15);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Missing dates - fixed height so layout never shifts */
  .missing-dates-fixed {
    height: 36px;
    display: flex;
    align-items: center;
    background: rgba(245,158,11,0.08);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    font-size: 11px;
    color: var(--warning);
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .missing-dates-fixed:has(>&nbsp;) {
    background: transparent;
    border-color: transparent;
  }

  /* Month selector */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .month-btn {
    padding: 10px 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: 'Onest', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .month-btn:hover { border-color: var(--accent); color: var(--accent); }
  .month-btn.active {
    background: rgba(79,142,247,0.15);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* Export success */
  .export-success {
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .export-icon { font-size: 24px; flex-shrink: 0; }
  .export-info h3 { font-size: 13px; font-weight: 600; color: var(--success); margin-bottom: 4px; }
  .export-info p { font-size: 12px; color: var(--text2); }

  /* Worker info pill */
  .worker-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 12px;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0 8px;
  }

  /* Section label */
  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Error state */
  .error-shake {
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* Alert */
  .alert {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    color: var(--danger);
  }

  /* Edit mode */
  .btn-edit {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #fff;
    box-shadow: 0 4px 12px rgba(217,119,6,0.25);
  }
  .btn-edit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(217,119,6,0.35); }

  .edit-mode-banner {
    background: rgba(217,119,6,0.12);
    border: 1px solid rgba(217,119,6,0.3);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 12px;
    color: #fbbf24;
    font-weight: 500;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .existing-entry-preview {
    background: rgba(217,119,6,0.07);
    border: 1px solid rgba(217,119,6,0.2);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .existing-entry-label {
    font-size: 11px;
    color: #fbbf24;
    font-weight: 600;
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .existing-entry-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
  }
  .existing-entry-hours {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text3);
  }

  /* Hidden */
  .hidden { display: none !important; }

  /* ── Login splash screen ──────────────────────────── */
  .login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,142,247,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(124,58,237,0.09) 0%, transparent 50%);
    z-index: 100;
  }
  .login-bg-glow {
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .login-card {
    position: relative;
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 40px 80px rgba(0,0,0,0.6),
      0 0 100px rgba(79,142,247,0.06);
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .login-card::before,
  .login-card::after {
    content: '';
    position: absolute;
    top: 0%;
    width: 40px;
    height: 100%;
    border-radius: 50%;
    filter: blur(22px);
    pointer-events: none;
    z-index: -1;
  }
  .login-card::before {
    left: -20px;
    background: linear-gradient(180deg, transparent 0%, rgba(239,100,60,0.7) 30%, rgba(249,158,11,0.5) 70%, transparent 100%);
  }
  .login-card::after {
    right: -20px;
    background: linear-gradient(180deg, transparent 0%, rgba(79,142,247,0.7) 30%, rgba(56,189,248,0.5) 70%, transparent 100%);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .login-logo-wrap {
    width: 100px; height: 100px;
    margin-bottom: clamp(20px, 4dvh, 36px);
    position: relative;
    z-index: 0;
  }
  .login-logo-wrap::before {
    content: '';
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    filter: blur(20px);
    z-index: -1;
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%, 100% { background: rgba(79,142,247,0.175);  }
    50%       { background: rgba(239,100,60,0.175); }
  }
  .login-logo {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .login-company {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    letter-spacing: -0.01em;
    margin-bottom: clamp(6px, 1.5dvh, 12px);
  }
  .login-system {
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: clamp(20px, 3.5dvh, 32px);
  }
  .login-divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin: 20px 0;
  }
  .login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .login-label {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    margin-bottom: 2px;
  }
  .login-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .login-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
  }
  .login-input::placeholder { color: var(--text3); }
  .login-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #3b7de8);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'Onest', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(79,142,247,0.3);
    margin-top: 4px;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,142,247,0.4); }
  .login-btn:active { transform: translateY(0); }
  .login-alert {
    padding: 10px 14px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--danger);
    text-align: center;
  }

  /* Responsive */
  @media (max-width: 520px) {
    body { padding: 8px; }
  }
</style>
</head>

// ─── Quarter helpers ──────────────────────────────────────────────────────────
// Each quarter is stored as a separate localStorage key:
//   tabelData_YYYY_Q1  →  January–March
//   tabelData_YYYY_Q2  →  April–June
//   tabelData_YYYY_Q3  →  July–September
//   tabelData_YYYY_Q4  →  October–December

function getQuarterKey(isoDate) {
  const [year, month] = isoDate.split('-').map(Number);
  const q = Math.ceil(month / 3);
  return `tabelData_${year}_Q${q}`;
}

function loadData() {
  try {
    const merged = {};
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && /^tabelData_\d{4}_Q[1-4]$/.test(key)) {
        const data = JSON.parse(localStorage.getItem(key) || '{}');
        for (const [uid, dates] of Object.entries(data)) {
          if (!merged[uid]) merged[uid] = {};
          Object.assign(merged[uid], dates);
        }
      }
    }
    // migrate legacy single key
    const legacy = localStorage.getItem('tabelData');
    if (legacy) {
      const legacyData = JSON.parse(legacy);
      for (const [uid, dates] of Object.entries(legacyData)) {
        if (!merged[uid]) merged[uid] = {};
        Object.assign(merged[uid], dates);
      }
      localStorage.removeItem('tabelData');
      state.tabelData = merged;
      saveData(); // re-save split by quarters
    }
    state.tabelData = merged;
  } catch(e) {}
}

function saveData() {
  try {
    // Group all entries by quarter key and save each separately
    const quarters = {};
    for (const [uid, dates] of Object.entries(state.tabelData)) {
      for (const [date, entry] of Object.entries(dates)) {
        const key = getQuarterKey(date);
        if (!quarters[key]) quarters[key] = {};
        if (!quarters[key][uid]) quarters[key][uid] = {};
        quarters[key][uid][date] = entry;
      }
    }
    // Clear existing quarter keys
    const keysToRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && /^tabelData_\d{4}_Q[1-4]$/.test(k)) keysToRemove.push(k);
    }
    keysToRemove.forEach(k => localStorage.removeItem(k));
    // Write updated quarters
    for (const [key, data] of Object.entries(quarters)) {
      localStorage.setItem(key, JSON.stringify(data));
    }
  } catch(e) {}
}

loadData();

// ─── Time helpers ─────────────────────────────────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function dateISO(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function formatDate(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function formatDateShort(iso) {
  const [y,m,d] = iso.split('-');
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${parseInt(d)} ${months[parseInt(m)-1]}`;
}

// ─── Calendar builder ──────────────────────────────────────────────────────────
function buildCalendar(monthMode) {
  const y = state.calViewYear, m = state.calViewMonth;
  const today = new Date();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDay = new Date(y, m, 1).getDay(); // 0=Sun
  const startOffset = firstDay === 0 ? 6 : firstDay - 1; // Mon-based

  const uid = state.currentUser?.id;
  const userTabel = uid ? (state.tabelData[uid] || {}) : {};

  const active = state.screen === 'check_date' ? state.checkDate : state.selectedDate;

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = dateISO(y, m, d);
    const isToday = iso === todayISO();
    const isSel = iso === active;
    const isFilled = !!userTabel[iso];
    const dow = new Date(y, m, d).getDay(); // 0=Sun,6=Sat
    const isWeekend = dow === 0 || dow === 6;
    const isFuture = new Date(y, m, d) > new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const isMissing = !isFilled && !isWeekend && !isFuture;
    const cls = ['cal-day',
      isToday ? 'today' : '',
      isSel   ? 'selected' : '',
      isFilled ? 'filled' : '',
      isMissing ? 'missing' : '',
      isWeekend ? 'weekend' : '',
      isFuture  ? 'disabled' : '',
    ].filter(Boolean).join(' ');
    const click = isFuture ? '' : `onclick="selectDay('${iso}')"`;
    cells += `<div class="${cls}" ${click}>${d}</div>`;
  }

  const mLabel = `${MONTHS_RU[m]} ${y}`;
  const prevOk = !(y === today.getFullYear() && m === today.getMonth() - 2);

  return `
    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calPrev()">‹</button>
        <div class="cal-title">${mLabel}</div>
        <button class="cal-nav" onclick="calNext()" ${y===today.getFullYear()&&m===today.getMonth()?'disabled style="opacity:.3;cursor:default"':''}>›</button>
      </div>
      <div class="cal-days-header">${DAYS_SHORT.map(d=>`<div class="cal-day-name">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}

// ─── Calendar nav ──────────────────────────────────────────────────────────────
function calPrev() {
  state.calViewMonth--;
  if (state.calViewMonth < 0) { state.calViewMonth = 11; state.calViewYear--; }
  renderInput();
}
function calNext() {
  const today = new Date();
  if (state.calViewYear === today.getFullYear() && state.calViewMonth === today.getMonth()) return;
  state.calViewMonth++;
  if (state.calViewMonth > 11) { state.calViewMonth = 0; state.calViewYear++; }
  renderInput();
}
function selectDay(iso) {
  if (state.screen === 'check_date') state.checkDate = iso;
  else state.selectedDate = iso;
  renderInput();
}
function selectMonth(i) {
  state.selectedMonth = i;
  renderInput();
}
function setHours(h) {
  state.extraHours = state.extraHours === h ? 0 : h;
  renderInput();
}
function updateCharCount() {
  const cnt = state.tabelText.length;
  const el = document.getElementById('charCount');
  if (el) { el.textContent = `${cnt}/300`; el.className = `char-count ${cnt>240?'warn':''}`; }
}

// ─── Missing dates ──────────────────────────────────────────────────────────────
function getMissingDates() {
  const uid = state.currentUser?.id;
  if (!uid) return [];
  const userTabel = state.tabelData[uid] || {};
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth();
  const todayD = today.getDate();
  const missing = [];
  for (let d = 1; d <= todayD; d++) {
    const iso = dateISO(y, m, d);
    const dow = new Date(y, m, d).getDay();
    if (dow !== 0 && dow !== 6 && !userTabel[iso]) missing.push(iso);
  }
  return missing;
}

// ─── Actions ──────────────────────────────────────────────────────────────────
function doLogin() {
  const l = (document.getElementById('loginLogin')?.value || state.loginInput).trim();
  const p = (document.getElementById('loginPassword')?.value || state.passwordInput).trim();
  state.loginInput = l; state.passwordInput = p;
  const splashAlert = document.getElementById('loginSplashAlert');
  if (!l || !p) {
    if (splashAlert) { splashAlert.classList.remove('hidden'); splashAlert.textContent = '❌ Введите логин и пароль.'; }
    return;
  }
  // Validate formats: login = 2 letters + 2 digits, password = 4 digits
  const loginOk = /^(pt|ip)-[a-z]+-\d+$/i.test(l);
  const passOk  = /^\d{4}$/.test(p);
  if (!loginOk || !passOk) {
    if (splashAlert) { splashAlert.classList.remove('hidden'); splashAlert.textContent = '❌ Неверный логин или пароль.'; }
    return;
  }
  const worker = EMPLOYEES.find(e =>
    e.login.toLowerCase() === l.toLowerCase() &&
    e.password === p
  );
  if (!worker) {
    if (splashAlert) {
      splashAlert.classList.remove('hidden');
      document.getElementById('loginScreen').classList.add('error-shake');
      setTimeout(() => document.getElementById('loginScreen').classList.remove('error-shake'), 500);
    }
    return;
  }
  state.currentUser = worker;
  state.screen = 'fill_date';
  state.selectedDate = null;
  state.extraHours = 0;
  state.tabelText = '';
  state.isEditing = false;
  resetCal();
  // Switch screens
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  addBotMsg(`Здравствуйте, ${worker.name}! Я — TabelBot, ваш помощник по учёту рабочего времени.`);
  const _missing = getMissingDates();
  if (_missing.length > 0) {
    addBotMsg(`Незаполненные дни: ${_missing.map(formatDateShort).join(', ')}.`);
  } else {
    addBotMsg('Все рабочие дни текущего месяца заполнены.');
  }
  render();
}

function goMenu() { state.screen = 'menu'; state.selectedDate = null; state.checkDate = null; resetCal(); render(); }
function doLogout() {
  state.currentUser = null;
  state.screen = 'login';
  state.loginInput = ''; state.passwordInput = '';
  state.messages = [];
  state.selectedDate = null; state.checkDate = null;
  state.extraHours = 0; state.tabelText = '';
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginLogin').value = '';
  document.getElementById('loginPassword').value = '';
}
function goHome() {
  if (state.currentUser) {
    state.selectedDate = null;
    state.extraHours = 0;
    state.tabelText = '';
    state.isEditing = false;
    state.checkDate = null;
    resetCal();
    state.screen = 'menu';
    addBotMsg(`Рад Вас видеть, ${state.currentUser.name}! Выберите вариант того, что Вы хотите сделать.`);
    render();
  } else {
    state.screen = 'login';
    state.loginInput = ''; state.passwordInput = '';
    state.messages = [];
    state.selectedDate = null; state.checkDate = null;
    state.extraHours = 0; state.tabelText = '';
    addBotMsg('Добрый день! Я — бот, созданный для работы с табелем учёта рабочего времени. Введите логин и пароль.');
    render();
  }
}
function resetCal() { const t = new Date(); state.calViewYear = t.getFullYear(); state.calViewMonth = t.getMonth(); }

function goFillDate() {
  state.screen = 'fill_date';
  state.selectedDate = null;
  state.extraHours = 0;
  state.tabelText = '';
  state.isEditing = false;
  resetCal();
  addBotMsg('Выберите дату, за которую хотите заполнить табель.');
  render();
}

function goEditFromCheck() {
  state.selectedDate = state.checkDate;
  state.screen = 'fill_date';
  resetCal();
  // Set calendar to the month of the selected date
  const [y, m] = state.selectedDate.split('-');
  state.calViewYear = parseInt(y);
  state.calViewMonth = parseInt(m) - 1;
  addBotMsg(`Выберите дату для редактирования.`);
  render();
}

function doFillDate() {
  if (!state.selectedDate) return;
  const uid = state.currentUser.id;
  const existing = (state.tabelData[uid] || {})[state.selectedDate];
  state.isEditing = !!existing;
  if (existing) {
    state.tabelText = existing.tabel === '(без описания)' ? '' : existing.tabel;
    state.extraHours = existing.plus || 0;
    addUserMsg(`Редактировать за ${formatDate(state.selectedDate)}`);
    addBotMsg(`Вы можете изменить данные за ${formatDate(state.selectedDate)}. Текущие данные уже загружены.`);
  } else {
    state.tabelText = '';
    state.extraHours = 0;
    addUserMsg(`Заполнить за ${formatDate(state.selectedDate)}`);
    addBotMsg(`Заполните данные за ${formatDate(state.selectedDate)}.`);
  }
  state.screen = 'fill_data';
  render();
}

function doSaveTabel() {
  const uid = state.currentUser.id;
  if (!state.tabelData[uid]) state.tabelData[uid] = {};
  state.tabelData[uid][state.selectedDate] = {
    tabel: state.tabelText || '(без описания)',
    plus: state.extraHours,
  };
  saveData();
  const hrs = state.extraHours ? `, доп. часы: +${state.extraHours}` : '';
  addUserMsg(`${state.tabelText || '(без описания)'}${hrs}`);
  state.screen = 'saved';
  const msg = state.isEditing
    ? 'Данные успешно обновлены! Выберите вариант того, что Вы хотите сделать дальше.'
    : 'Спасибо! Данные успешно внесены! Выберите вариант того, что Вы хотите сделать дальше.';
  addBotMsg(msg);
  state.isEditing = false;
  render();
}

function goCheckDate() {
  state.screen = 'check_date';
  state.checkDate = null;
  resetCal();
  const missing = getMissingDates();
  const msg = missing.length > 0
    ? `Вы не заполнили табель на следующие даты: ${missing.map(formatDateShort).join(', ')}. Выберите дату, за которую хотите проверить табель.`
    : 'Выберите дату, за которую хотите проверить табель.';
  addBotMsg(msg);
  render();
}

function doCheckDate() {
  if (!state.checkDate) return;
  addUserMsg(`Проверить ${formatDate(state.checkDate)}`);
  const uid = state.currentUser.id;
  const entry = (state.tabelData[uid] || {})[state.checkDate];
  if (entry) {
    const hrs = entry.plus ? `, доп. часы: +${entry.plus} ч` : '';
    addBotMsg(`За ${formatDate(state.checkDate)} Вы заполнили: ${entry.tabel}${hrs}.`);
  } else {
    addBotMsg(`Данные отсутствуют!`);
  }
  state.screen = 'check_view';
  render();
}

function goExportPwd() {
  state.screen = 'export_pwd';
  addBotMsg('Введите пароль для доступа к сводному табелю.');
  render();
}

function doCheckPwd() {
  const pwd = document.getElementById('pwdInput')?.value || '';
  const alert = document.getElementById('pwdAlert');
  if (ADMIN_PASSWORDS.includes(pwd)) {
    addUserMsg('••••••••');
    state.selectedMonth = null;
    state.screen = 'export_month';
    addBotMsg('Выберите месяц, за который хотите выгрузить табель.');
    render();
  } else {
    if (alert) {
      alert.classList.remove('hidden');
      document.getElementById('inputArea').classList.add('error-shake');
      setTimeout(() => document.getElementById('inputArea').classList.remove('error-shake'), 500);
    }
  }
}

function doExport() {
  if (state.selectedMonth === null) return;
  addUserMsg(`Выгрузить за ${MONTHS_RU[state.selectedMonth]}`);

  // Build CSV/XLSX data
  const rows = [['Реестровый номер','Имя','Фамилия','Дата','Данные','Доп.часы']];
  const y = new Date().getFullYear(), m = state.selectedMonth;
  const pad = n => String(n).padStart(2,'0');

  for (const emp of EMPLOYEES) {
    const empData = state.tabelData[emp.id] || {};
    const daysInMonth = new Date(y, m+1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${y}-${pad(m+1)}-${pad(d)}`;
      if (empData[iso]) {
        rows.push([emp.id, emp.name, emp.surname, formatDate(iso), empData[iso].tabel, empData[iso].plus || 0]);
      }
    }
  }

  // Download as CSV
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tabel_${pad(m+1)}_${y}.csv`;
  a.click();
  URL.revokeObjectURL(url);

  state.screen = 'export_done';
  addBotMsg(`Сводный табель за ${MONTHS_RU[state.selectedMonth]} ${y} сформирован и отправлен на скачивание.`);
  render();
}

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
